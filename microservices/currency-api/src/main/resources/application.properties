spring.application.name=currency-api

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.config.import=consul:
spring.cloud.consul.config.format=KEY_VALUE

# API PTAX: atividade usa uma data fixa de dia util, nao cotacao do dia atual.
bcb.ptax.base-url=https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata
bcb.ptax.data-cotacao=2026-10-27

# Cache somente da cotacao externa bem-sucedida (moeda + data).
spring.cache.type=caffeine
spring.cache.cache-names=cotacoes-bcb
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

# Resilience4j: a primeira tentativa conta como uma das tres.
resilience4j.retry.instances.bcb-ptax.max-attempts=3
resilience4j.retry.instances.bcb-ptax.wait-duration=1s
resilience4j.retry.instances.bcb-ptax.ignore-exceptions[0]=io.github.resilience4j.circuitbreaker.CallNotPermittedException
resilience4j.retry.instances.bcb-ptax.ignore-exceptions[1]=br.edu.atitus.currencyapi.bcb.BcbQuoteNotFoundException

# Circuit Breaker: 5 chamadas, limiar 50%, circuito aberto por 100 s.
resilience4j.circuitbreaker.instances.bcb-ptax.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.bcb-ptax.sliding-window-size=5
resilience4j.circuitbreaker.instances.bcb-ptax.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.bcb-ptax.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bcb-ptax.wait-duration-in-open-state=100s
resilience4j.circuitbreaker.instances.bcb-ptax.ignore-exceptions[0]=br.edu.atitus.currencyapi.bcb.BcbQuoteNotFoundException

# Logs para observar fallback, tentativas, consultas e transicoes do circuito.
logging.level.br.edu.atitus.currencyapi.services=INFO
